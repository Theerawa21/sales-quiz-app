<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>สอบกลางภาคเรียนที่ 1 ปีการศึกษา 2569</title><style>body{font-family:Sarabun,system-ui,sans-serif;background:#f4f7fb;margin:0;color:#152238}.wrap{max-width:760px;margin:auto;padding:16px}.hero{background:#173b6c;color:#fff;padding:22px;border-radius:18px}.card{background:#fff;border:1px solid #dfe6ef;border-radius:16px;padding:18px;margin-top:14px}input,button{font:inherit}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:10px;margin:6px 0 12px}button{width:100%;padding:13px;border:0;border-radius:10px;background:#173b6c;color:white;font-weight:700}.hidden{display:none}.choice{display:block;padding:13px;border:1px solid #dfe6ef;border-radius:12px;margin:8px 0}.row{display:flex;gap:8px}.pill{flex:1;background:#fff;border:1px solid #dfe6ef;border-radius:12px;padding:10px;text-align:center}.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:10px;border-radius:10px}.ok{background:#ecfdf3;border:1px solid #abefc6;color:#067647;padding:12px;border-radius:10px}.err{background:#fef3f2;border:1px solid #fecdca;color:#b42318;padding:10px;border-radius:10px}.muted{color:#667085;font-size:14px}.progress{height:8px;background:#e8edf4;border-radius:99px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:#173b6c;width:0}</style></head><body><div class="wrap"><div class="hero"><h1>แบบทดสอบกลางภาคเรียนที่ 1 ปีการศึกษา 2569</h1><div>รายวิชาการขายสำหรับนักธุรกิจมืออาชีพ • ม.4/3–ม.4/5</div></div><div id="login" class="card"><div class="warn">ระบบสุ่มข้อสอบและตัวเลือก ตรวจการสลับแอป/ออกจากหน้าจอ และส่งอัตโนมัติเมื่อครบจำนวนที่กำหนด</div><label>รหัสนักเรียน</label><input id="sid" inputmode="numeric"><label>รหัสเข้าห้องสอบ</label><input id="code"><button onclick="lookup()">ตรวจสอบและเริ่มสอบ</button><div id="msg"></div></div><div id="exam" class="hidden"><div class="row"><div class="pill">ข้อ <b id="qn">-</b></div><div class="pill">เวลา <b id="tm">--:--</b></div><div class="pill">ออกจอ <b id="sw">0</b></div></div><div class="progress"><div id="pg"></div></div><div class="card"><div id="who" class="muted"></div><h2 id="qt"></h2><div id="choices"></div><button onclick="answer()">ยืนยันคำตอบและไปข้อต่อไป</button><div id="emsg"></div></div></div><div id="done" class="card hidden"><div class="ok"><h2>ส่งข้อสอบเรียบร้อยแล้ว</h2><div id="doneText"></div></div></div></div><script>var API='PASTE_APPS_SCRIPT_EXEC_URL_HERE';var st={sessionId:null,expiresAt:0,q:null,submitted:false,lastEvent:0};function api(action,payload,method){method=method||'POST';if(API.indexOf('PASTE_')===0)return Promise.reject(new Error('ยังไม่ได้ตั้งค่า Apps Script URL'));if(method==='GET'){var qs=new URLSearchParams(Object.assign({action:action},payload||{}));return fetch(API+'?'+qs.toString()).then(p=>p.json()).then(check)}return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:action,payload:payload||{}})}).then(p=>p.json()).then(check)}function check(x){if(!x.ok)throw new Error(x.error||'เกิดข้อผิดพลาด');return x.data}function show(id,t,c){document.getElementById(id).innerHTML='<div class="'+c+'">'+esc(t)+'</div>'}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function lookup(){var sid=document.getElementById('sid').value.trim(),code=document.getElementById('code').value.trim();api('lookupStudent',{studentId:sid,examCode:code},'GET').then(r=>{if(!r.found)throw new Error('ไม่พบรายชื่อนักเรียน');if(r.alreadyTaken)throw new Error('นักเรียนส่งข้อสอบแล้ว');return api('startExam',{studentId:sid,examCode:code,userAgent:navigator.userAgent})}).then(started).catch(e=>show('msg',e.message,'err'))}function started(r){if(r.alreadyTaken)throw new Error('นักเรียนส่งข้อสอบแล้ว');st.sessionId=r.sessionId;st.expiresAt=r.expiresAtMs;st.q=r.question;document.getElementById('who').textContent=r.student.studentId+' • '+r.student.fullName+' • '+r.student.className;document.getElementById('sw').textContent=r.tabSwitchCount||0;document.getElementById('login').classList.add('hidden');document.getElementById('exam').classList.remove('hidden');render(r.question);clock();setInterval(clock,1000);setInterval(hb,15000);guard()}function render(q){st.q=q;document.getElementById('qn').textContent=q.number+'/'+q.total;document.getElementById('qt').textContent=q.text;document.getElementById('pg').style.width=((q.number-1)/q.total*100)+'%';var c=document.getElementById('choices');c.innerHTML='';q.choices.forEach((x,i)=>c.insertAdjacentHTML('beforeend','<label class="choice"><input type="radio" name="a" value="'+i+'"> '+esc(x)+'</label>'))}function answer(){var x=document.querySelector('input[name=a]:checked');if(!x)return show('emsg','กรุณาเลือกคำตอบ','err');api('saveAnswer',{sessionId:st.sessionId,qid:st.q.qid,choiceIndex:Number(x.value)}).then(r=>{if(r.finished)return finish(r.result);render(r.question)}).catch(e=>show('emsg',e.message,'err'))}function clock(){if(!st.expiresAt||st.submitted)return;var ms=st.expiresAt-Date.now();if(ms<=0){st.submitted=true;return api('submitExam',{sessionId:st.sessionId,reason:'TIME_EXPIRED'}).then(finish)}var s=Math.floor(ms/1000);document.getElementById('tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function hb(){if(!st.sessionId||st.submitted)return;api('heartbeat',{sessionId:st.sessionId},'GET').then(r=>{if(r.result)return finish(r.result);if(r.expiresAtMs)st.expiresAt=r.expiresAtMs;if(r.tabSwitchCount!=null)document.getElementById('sw').textContent=r.tabSwitchCount}).catch(()=>{})}function guard(){document.addEventListener('visibilitychange',()=>{if(document.hidden)evt('APP_SWITCH','hidden')});document.addEventListener('fullscreenchange',()=>{if(st.sessionId&&!st.submitted&&!document.fullscreenElement)evt('FULLSCREEN_EXIT','exit')});['copy','cut','paste','contextmenu'].forEach(n=>document.addEventListener(n,e=>{if(st.sessionId&&!st.submitted)e.preventDefault()}));try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}}function evt(ev,d){if(!st.sessionId||st.submitted||Date.now()-st.lastEvent<3000)return;st.lastEvent=Date.now();api('reportEvent',{sessionId:st.sessionId,event:ev,details:d}).then(r=>{if(r.tabSwitchCount!=null)document.getElementById('sw').textContent=r.tabSwitchCount;if(r.forcedSubmit)finish(r.result)}).catch(()=>{})}function finish(r){st.submitted=true;document.getElementById('exam').classList.add('hidden');document.getElementById('login').classList.add('hidden');document.getElementById('done').classList.remove('hidden');document.getElementById('doneText').textContent=(r&&r.message)||'ระบบได้รับคำตอบเรียบร้อยแล้ว'}</script></body></html>
